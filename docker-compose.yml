services:
  calendry-app:
    image: ghcr.io/mindcollaps/calendry:latest
    container_name: calendry-app
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NITRO_HOST=0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    env_file:
      - .env
    healthcheck:
      test:
          - CMD-SHELL
          - 'wget --no-verbose http://127.0.0.1:3000/health || exit 1'
      interval: 30s
      timeout: 20s
      retries: 10
  solver:
    # Same shape as calendry-app: a published image in production, built from
    # the vendored submodule by the dev override.
    image: ghcr.io/mindcollaps/calendry-solver:latest
    container_name: calendry-solver
    environment:
      - CALENDRY_SOLVER_ADDR=0.0.0.0:50051
    restart: unless-stopped

  db:
    image: 'postgres:18.1-alpine'
    container_name: calendry-db
    volumes:
      - db_data:/var/lib/postgresql/18/docker
      - ./.config/db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}'
      interval: 5s
      timeout: 20s
      retries: 10
    env_file:
      - .env

volumes:
  db_data:
  redis_data:
