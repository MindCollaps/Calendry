services:
  calendry-app:
    build:
      context: .
      dockerfile: .config/Dockerfile.dev
    # The working tree is bind-mounted read-write below, so anything this
    # container writes (.nuxt, .output, node_modules) lands in the repo with the
    # container's ownership. Running as root therefore leaves root-owned build
    # artifacts that break every subsequent host-side command with EACCES.
    # `bun run dev` already exports UID/GID for this; nothing consumed them.
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOME=/app
      # `environment` beats `env_file`, so this overrides .env's HOST value
      # without editing it — host-run tooling still needs 127.0.0.1 there.
      - CALENDRY_SOLVER_ADDR=solver:50051
      # ⚠ UNVERIFIED — NEEDS REVISITING. Left in place so it is not forgotten,
      # but do not trust it until someone actually runs `docker compose up`.
      #
      # This was built for the .npmrc mechanism, which Stage 1 replaced with
      # ~/.bunfig.toml. NPM_CONFIG_USERCONFIG relocates an .npmrc; it does NOT
      # relocate bunfig.toml, so as written this variable no longer points at
      # the credential the project actually uses.
      #
      # The constraint that made it awkward still stands: the dev container runs
      # `bun install` from its ENTRYPOINT (the repo is bind-mounted), so a
      # BuildKit secret cannot reach it — and HOME is /app, which IS the repo,
      # so mounting at $HOME/.bunfig.toml would drop a token into the working
      # tree. The likely fix is `bun install -c /run/secrets/bunfig` in
      # entrypoint.dev.sh, but a probe of `-c` produced no registry request, so
      # that flag is not known to work and must be tested first.
      - NPM_CONFIG_USERCONFIG=/run/secrets/npmrc
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "51212:51212"
    volumes:
      - .:/app:rw
      # Read-only, and the host path is the developer's own ~/.npmrc — the token
      # never enters the repo or any image layer.
      # ⚠ Same deferral as the variable above — path and mechanism unverified.
      - ${HOME}/.npmrc:/run/secrets/npmrc:ro
    depends_on:
      db:
        condition: service_healthy
      solver:
        condition: service_started

  db:
    # Must match docker-compose.yml — dev and prod on different major versions
    # means migrations are verified against something production never runs.
    image: 'postgres:18.1-alpine'
    # Published for HOST-side tooling only: the Prisma CLI, the integration
    # tests and `provision:tenant` all run outside the compose network, where
    # the `db` hostname does not resolve. Deliberately not 5432, so this cannot
    # collide with a Postgres already installed on the machine. Dev only — the
    # production compose file exposes nothing.
    ports:
      - "55432:5432"
    volumes:
      - ./db/:/var/lib/postgresql/18/docker:rw
      # Compose replaces volume lists rather than merging them, so the runtime
      # role provisioning from docker-compose.yml must be repeated here.
      - ./.config/db-init:/docker-entrypoint-initdb.d:ro

  solver:
    build:
      # The vendored submodule, so `docker compose up` needs no second checkout.
      context: ./vendor/calendry-solver
      dockerfile: ../../.config/Dockerfile.solver
    container_name: calendry-solver
    environment:
      # Bind on all interfaces INSIDE the container. Its own default is
      # 127.0.0.1, which nothing outside the container can reach.
      - CALENDRY_SOLVER_ADDR=0.0.0.0:50051
    # Published for HOST-side tooling only, exactly like the database's 55432:
    # `bun run test` starts a Nuxt server on the host, outside the compose
    # network, where the `solver` hostname does not resolve. Production
    # publishes nothing.
    ports:
      - "50051:50051"
    restart: unless-stopped
